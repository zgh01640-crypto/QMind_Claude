services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${QMIND_DATA_ROOT:-/opt/qmind/data}/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${QMIND_API_IMAGE}:${QMIND_IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      PRICING_KB_ADMIN_TOKEN: ${PRICING_KB_ADMIN_TOKEN}
      PRICING_KB_UPLOAD_DIR: /app/.data/pricing-kb-uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${QMIND_DATA_ROOT:-/opt/qmind/data}/api:/app/.data:Z

  web:
    image: ${QMIND_WEB_IMAGE}:${QMIND_IMAGE_TAG}
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8005
    depends_on:
      - api
    ports:
      - "127.0.0.1:3001:3001"
